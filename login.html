<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Admin — Intranet HPS</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231D71B8'/><text y='24' x='4' font-size='22' font-family='Arial'>🔒</text></svg>">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--sombra-md);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .login-header {
      background: var(--azul);
      padding: 32px 32px 28px;
      text-align: center;
      color: #fff;
    }
    .login-header img { height: 36px; margin: 0 auto 16px; }
    .login-header h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .login-header p  { font-size: 13px; opacity: .8; margin: 0; }
    .login-body { padding: 28px 32px 32px; }
    .login-body label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--cinza-texto);
      margin-bottom: 16px;
    }
    .login-body input {
      padding: 11px 14px;
      border: 1.5px solid var(--cinza-borda);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: var(--cinza-fundo);
      color: var(--texto-escuro);
      transition: border-color .2s, box-shadow .2s;
    }
    .login-body input:focus {
      outline: none;
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(29,113,184,.14);
      background: #fff;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--azul);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
      margin-top: 4px;
    }
    .btn-login:hover { background: var(--azul-hover); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .login-error {
      display: none;
      background: #fee2e2;
      color: #c53030;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .login-footer {
      text-align: center;
      padding: 0 32px 24px;
      font-size: 12px;
      color: var(--cinza-texto);
    }
    .login-footer a { color: var(--azul); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-logo">
        <img src="assets/img/hapvida-logo.png" alt="Hapvida" class="logo-img">
        <div class="logo-divider"></div>
        <div class="logo-hospital">
          <span class="nome">Hospital Paulo Sacramento</span>
          <span class="sub">Jundiaí · SP</span>
        </div>
      </a>
      <nav class="header-nav">
        <a href="index.html">← Início</a>
      </nav>
    </div>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <img src="assets/img/hapvida-logo.png" alt="Hapvida">
        <h1>🔒 Acesso Administrativo</h1>
        <p>Intranet HPS — Hospital Paulo Sacramento</p>
      </div>
      <div class="login-body">
        <div class="login-error" id="login-error">E-mail ou senha incorretos.</div>
        <label>E-mail
          <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email" />
        </label>
        <label>Senha
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
        </label>
        <button class="btn-login" id="login-btn">Entrar</button>
      </div>
      <div class="login-footer">
        <a href="index.html">Voltar para a Intranet</a>
        &nbsp;·&nbsp;
        Somente usuários autorizados
      </div>
    </div>
  </div>

  <footer class="site-footer">
    Intranet HPS — uso exclusivo da equipe do Hospital Paulo Sacramento
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Se já logado, redireciona
    const user = await Auth.getUser();
    if (user) {
      const next = new URLSearchParams(location.search).get('next') || 'index.html';
      location.href = next;
      return;
    }

    const emailEl    = document.getElementById('login-email');
    const passEl     = document.getElementById('login-password');
    const btnEl      = document.getElementById('login-btn');
    const errorEl    = document.getElementById('login-error');

    async function doLogin() {
      let email      = emailEl.value.trim();
      const password = passEl.value;
      // Suporte a login simplificado: "admin" → "admin@intranet.hps"
      if (email && !email.includes('@')) email = email + '@intranet.hps';
      if (!email || !password) return;

      btnEl.disabled = true;
      btnEl.textContent = 'Entrando…';
      errorEl.style.display = 'none';

      try {
        await Auth.signIn(email, password);
        const next = new URLSearchParams(location.search).get('next') || 'index.html';
        location.href = next;
      } catch(e) {
        errorEl.style.display = 'block';
        btnEl.disabled = false;
        btnEl.textContent = 'Entrar';
        passEl.value = '';
        passEl.focus();
      }
    }

    btnEl.addEventListener('click', doLogin);
    passEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    emailEl.focus();
  });
  </script>
</body>
</html>
