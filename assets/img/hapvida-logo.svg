<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60">
  <!-- Flower symbol: 5 petals, warm palette red→orange→yellow -->
  <g transform="translate(24,30)">
    <!-- Top: dark red -->
    <ellipse cx="0" cy="-14" rx="6.5" ry="11" fill="#D62525"/>
    <!-- Upper-right: orange-red -->
    <ellipse cx="0" cy="-14" rx="6.5" ry="11" fill="#F04E23" transform="rotate(72)"/>
    <!-- Lower-right: orange -->
    <ellipse cx="0" cy="-14" rx="6.5" ry="11" fill="#F7941D" transform="rotate(144)"/>
    <!-- Lower-left: yellow -->
    <ellipse cx="0" cy="-14" rx="6.5" ry="11" fill="#F5C206" transform="rotate(-144)"/>
    <!-- Upper-left: orange-red -->
    <ellipse cx="0" cy="-14" rx="6.5" ry="11" fill="#F26522" transform="rotate(-72)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="5.5" fill="#F37021"/>
  </g>
  <!-- "hapvida" in Hapvida blue for light backgrounds -->
  <text x="52" y="38"
        font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif"
        font-size="26" font-weight="700" fill="#1D71B8"
        letter-spacing="-.3">hapvida</text>
</svg>
